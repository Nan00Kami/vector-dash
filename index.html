<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Realm of Blades - 3D Web RPG</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #090a0f;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
    /* UI Overlay */
    #ui-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px;
    }
    .hud-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      width: 100%;
    }
    .player-card {
      background: rgba(18, 22, 36, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(8px);
      padding: 16px 20px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      color: #fff;
      min-width: 250px;
    }
    .player-title {
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #8fa0c0;
      margin-bottom: 8px;
    }
    .bar-container {
      background: rgba(0, 0, 0, 0.6);
      border-radius: 8px;
      height: 14px;
      width: 100%;
      overflow: hidden;
      position: relative;
      margin-bottom: 8px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .bar-fill-hp {
      background: linear-gradient(90deg, #ff3366, #ff6b6b);
      height: 100%;
      width: 100%;
      transition: width 0.15s ease-out;
    }
    .bar-fill-xp {
      background: linear-gradient(90deg, #38ef7d, #11998e);
      height: 100%;
      width: 0%;
      transition: width 0.2s ease-out;
    }
    .stats-row {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: #cbd5e1;
      font-weight: 600;
    }
    .quest-card {
      background: rgba(18, 22, 36, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(8px);
      padding: 14px 20px;
      border-radius: 12px;
      color: #f1f5f9;
      font-size: 14px;
    }
    .controls-hint {
      background: rgba(18, 22, 36, 0.6);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      color: #94a3b8;
      font-size: 12px;
      padding: 8px 16px;
      align-self: center;
    }
    .dmg-popup {
      position: absolute;
      color: #ff3344;
      font-weight: 900;
      font-size: 20px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
      pointer-events: none;
      animation: floatUp 0.8s forwards ease-out;
    }
    @keyframes floatUp {
      0% { transform: translate(-50%, 0) scale(0.7); opacity: 0; }
      20% { transform: translate(-50%, -10px) scale(1.2); opacity: 1; }
      100% { transform: translate(-50%, -45px) scale(0.9); opacity: 0; }
    }
  </style>
  <!-- Three.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <div id="canvas-container"></div>

  <div id="ui-layer">
    <div class="hud-top">
      <div class="player-card">
        <div class="player-title">Hero • Lvl <span id="lvl-display">1</span></div>
        <div class="bar-container">
          <div id="hp-bar" class="bar-fill-hp"></div>
        </div>
        <div class="bar-container" style="height: 8px;">
          <div id="xp-bar" class="bar-fill-xp"></div>
        </div>
        <div class="stats-row">
          <span>HP: <span id="hp-text">100/100</span></span>
          <span>EXP: <span id="xp-text">0/100</span></span>
        </div>
      </div>
      <div class="quest-card">
        <div><strong>Slimes Defeated:</strong> <span id="kill-count">0</span></div>
      </div>
    </div>

    <div class="controls-hint">
      <strong>[WASD / Arrows]</strong> Move &bull; <strong>[Space / Left Click]</strong> Attack
    </div>
  </div>

  <script>
    // --- 1. Scene, Camera, Renderer Setup ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0e141f);
    scene.fog = new THREE.FogExp2(0x0e141f, 0.022);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;
    container.appendChild(renderer.domElement);

    // --- 2. Lighting & Atmosphere ---
    const hemiLight = new THREE.HemisphereLight(0x7694b8, 0x222831, 0.7);
    scene.add(hemiLight);

    const sun = new THREE.DirectionalLight(0xffecd2, 1.2);
    sun.position.set(25, 40, 20);
    sun.castShadow = true;
    sun.shadow.mapSize.width = 2048;
    sun.shadow.mapSize.height = 2048;
    sun.shadow.camera.near = 0.5;
    sun.shadow.camera.far = 100;
    const d = 35;
    sun.shadow.camera.left = -d;
    sun.shadow.camera.right = d;
    sun.shadow.camera.top = d;
    sun.shadow.camera.bottom = -d;
    sun.shadow.bias = -0.0005;
    scene.add(sun);

    // --- 3. Environment & Terrain ---
    const groundGeo = new THREE.PlaneGeometry(160, 160, 48, 48);
    groundGeo.rotateX(-Math.PI / 2);
    const pos = groundGeo.attributes.position;
    for (let i = 0; i < pos.count; i++) {
      const vx = pos.getX(i);
      const vz = pos.getZ(i);
      // Subtle terrain undulation away from center spawn
      const dist = Math.sqrt(vx * vx + vz * vz);
      if (dist > 8) {
        pos.setY(i, Math.sin(vx * 0.12) * Math.cos(vz * 0.12) * 0.8);
      }
    }
    groundGeo.computeVertexNormals();

    const groundMat = new THREE.MeshStandardMaterial({
      color: 0x233827,
      roughness: 0.85,
      metalness: 0.05
    });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.receiveShadow = true;
    scene.add(ground);

    // Decorative Forest Props (Trees & Rocks)
    function createTree(x, z) {
      const group = new THREE.Group();
      // Trunk
      const trunkMat = new THREE.MeshStandardMaterial({ color: 0x3d2719, roughness: 0.9 });
      const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.35, 1.6, 6), trunkMat);
      trunk.position.y = 0.8;
      trunk.castShadow = true;
      trunk.receiveShadow = true;
      group.add(trunk);

      // Foliage layers
      const foliageMat = new THREE.MeshStandardMaterial({ color: 0x1f5c35, roughness: 0.6, flatShading: true });
      const c1 = new THREE.Mesh(new THREE.ConeGeometry(1.6, 2.2, 6), foliageMat);
      c1.position.y = 2.0;
      c1.castShadow = true;
      const c2 = new THREE.Mesh(new THREE.ConeGeometry(1.2, 1.8, 6), foliageMat);
      c2.position.y = 3.0;
      c2.castShadow = true;
      group.add(c1);
      group.add(c2);

      const s = 0.7 + Math.random() * 0.5;
      group.scale.set(s, s, s);
      group.position.set(x, 0, z);
      scene.add(group);
    }

    for (let i = 0; i < 65; i++) {
      const radius = 10 + Math.random() * 60;
      const angle = Math.random() * Math.PI * 2;
      createTree(Math.cos(angle) * radius, Math.sin(angle) * radius);
    }

    // --- 4. Hero Character ---
    const player = new THREE.Group();
    scene.add(player);

    const bodyMat = new THREE.MeshStandardMaterial({ color: 0x2563eb, roughness: 0.4 });
    const skinMat = new THREE.MeshStandardMaterial({ color: 0xffdbac, roughness: 0.6 });
    const metalMat = new THREE.MeshStandardMaterial({ color: 0xd1d5db, metalness: 0.8, roughness: 0.2 });

    // Torso
    const torso = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.9, 0.45), bodyMat);
    torso.position.y = 1.1;
    torso.castShadow = true;
    player.add(torso);

    // Head
    const head = new THREE.Mesh(new THREE.BoxGeometry(0.45, 0.45, 0.45), skinMat);
    head.position.y = 1.8;
    head.castShadow = true;
    player.add(head);

    // Limbs
    const armGeo = new THREE.BoxGeometry(0.2, 0.7, 0.2);
    const leftArm = new THREE.Mesh(armGeo, skinMat);
    leftArm.position.set(-0.5, 1.1, 0);
    leftArm.castShadow = true;
    player.add(leftArm);

    const rightArm = new THREE.Mesh(armGeo, skinMat);
    rightArm.position.set(0.5, 1.1, 0);
    rightArm.castShadow = true;
    player.add(rightArm);

    const legGeo = new THREE.BoxGeometry(0.26, 0.7, 0.26);
    const leftLeg = new THREE.Mesh(legGeo, bodyMat);
    leftLeg.position.set(-0.2, 0.45, 0);
    leftLeg.castShadow = true;
    player.add(leftLeg);

    const rightLeg = new THREE.Mesh(legGeo, bodyMat);
    rightLeg.position.set(0.2, 0.45, 0);
    rightLeg.castShadow = true;
    player.add(rightLeg);

    // Weapon (Broadsword)
    const sword = new THREE.Group();
    const blade = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.9, 0.04), metalMat);
    blade.position.y = 0.45;
    blade.castShadow = true;
    const hilt = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.05, 0.08), bodyMat);
    sword.add(blade);
    sword.add(hilt);
    sword.position.set(0.1, -0.25, 0.3);
    sword.rotation.x = Math.PI / 3;
    rightArm.add(sword);

    // Attack Slash FX
    const slashArcGeo = new THREE.RingGeometry(0.7, 1.6, 16, 1, 0, Math.PI * 0.8);
    const slashMat = new THREE.MeshBasicMaterial({ color: 0x60a5fa, side: THREE.DoubleSide, transparent: true, opacity: 0 });
    const slashFx = new THREE.Mesh(slashArcGeo, slashMat);
    slashFx.rotation.x = -Math.PI / 2;
    slashFx.position.set(0, 0.9, 0.6);
    player.add(slashFx);

    // --- 5. Player Stats & State ---
    const hero = {
      hp: 100,
      maxHp: 100,
      level: 1,
      xp: 0,
      xpNeeded: 100,
      kills: 0,
      speed: 8.5,
      attackPower: 35,
      isAttacking: false,
      attackTime: 0
    };

    // --- 6. Enemy Spawner & Logic ---
    const enemies = [];
    const slimeGeo = new THREE.SphereGeometry(0.55, 16, 16);
    const slimeMat = new THREE.MeshStandardMaterial({
      color: 0x10b981,
      roughness: 0.2,
      metalness: 0.1,
      transparent: true,
      opacity: 0.9
    });

    function spawnEnemy() {
      const angle = Math.random() * Math.PI * 2;
      const radius = 12 + Math.random() * 22;
      const enemyMesh = new THREE.Mesh(slimeGeo, slimeMat.clone());
      enemyMesh.position.set(
        player.position.x + Math.cos(angle) * radius,
        0.55,
        player.position.z + Math.sin(angle) * radius
      );
      enemyMesh.castShadow = true;
      scene.add(enemyMesh);

      enemies.push({
        mesh: enemyMesh,
        hp: 60,
        maxHp: 60,
        speed: 3.2,
        attackCooldown: 0
      });
    }

    // Initial batch
    for (let i = 0; i < 10; i++) spawnEnemy();

    // Floating combat text overlay
    function showDamageNumber(pos3D, amount) {
      const screenPos = pos3D.clone().project(camera);
      const x = (screenPos.x * 0.5 + 0.5) * window.innerWidth;
      const y = (-(screenPos.y * 0.5) + 0.5) * window.innerHeight;

      const el = document.createElement('div');
      el.className = 'dmg-popup';
      el.innerText = `-${amount}`;
      el.style.left = `${x}px`;
      el.style.top = `${y}px`;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 800);
    }

    // --- 7. Input Controller ---
    const keys = {};
    window.addEventListener('keydown', (e) => {
      keys[e.key.toLowerCase()] = true;
      if (e.code === 'Space') executeAttack();
    });
    window.addEventListener('keyup', (e) => {
      keys[e.key.toLowerCase()] = false;
    });
    window.addEventListener('pointerdown', (e) => {
      if (e.button === 0) executeAttack();
    });

    function executeAttack() {
      if (hero.isAttacking) return;
      hero.isAttacking = true;
      hero.attackTime = 0;
      slashMat.opacity = 0.8;

      // Hit scan nearby enemies
      enemies.forEach((enemy) => {
        const dist = player.position.distanceTo(enemy.mesh.position);
        if (dist < 2.5) {
          const dmg = hero.attackPower + Math.floor(Math.random() * 10);
          enemy.hp -= dmg;
          showDamageNumber(enemy.mesh.position, dmg);

          // Knockback
          const knockDir = enemy.mesh.position.clone().sub(player.position).normalize();
          enemy.mesh.position.addScaledVector(knockDir, 1.2);
        }
      });
    }

    // --- 8. Game Loop ---
    const clock = new THREE.Clock();

    function update() {
      requestAnimationFrame(update);
      const delta = Math.min(clock.getDelta(), 0.1);
      const time = clock.getElapsedTime();

      // Movement Vector
      const move = new THREE.Vector3(0, 0, 0);
      if (keys['w'] || keys['arrowup']) move.z -= 1;
      if (keys['s'] || keys['arrowdown']) move.z += 1;
      if (keys['a'] || keys['arrowleft']) move.x -= 1;
      if (keys['d'] || keys['arrowright']) move.x += 1;

      const isMoving = move.lengthSq() > 0;

      if (isMoving) {
        move.normalize();
        player.position.addScaledVector(move, hero.speed * delta);
        
        // Orient hero toward movement
        const targetRot = Math.atan2(move.x, move.z);
        player.rotation.y = THREE.MathUtils.lerp(player.rotation.y, targetRot, 0.2);

        // Procedural Run cycle
        const walkCycle = Math.sin(time * 12);
        leftLeg.rotation.x = walkCycle * 0.7;
        rightLeg.rotation.x = -walkCycle * 0.7;
        leftArm.rotation.x = -walkCycle * 0.6;
        if (!hero.isAttacking) rightArm.rotation.x = walkCycle * 0.6;
      } else {
        // Idle recovery
        leftLeg.rotation.x = THREE.MathUtils.lerp(leftLeg.rotation.x, 0, 0.1);
        rightLeg.rotation.x = THREE.MathUtils.lerp(rightLeg.rotation.x, 0, 0.1);
        leftArm.rotation.x = THREE.MathUtils.lerp(leftArm.rotation.x, 0, 0.1);
        if (!hero.isAttacking) rightArm.rotation.x = THREE.MathUtils.lerp(rightArm.rotation.x, 0, 0.1);
      }

      // Attack Animation Cycle
      if (hero.isAttacking) {
        hero.attackTime += delta * 7;
        rightArm.rotation.x = Math.sin(hero.attackTime) * 1.6;
        slashMat.opacity = Math.max(0, slashMat.opacity - delta * 3.5);
        if (hero.attackTime >= Math.PI) {
          hero.isAttacking = false;
          slashMat.opacity = 0;
        }
      }

      // Enemy Logic
      for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        
        // Slime squash & stretch breathing
        e.mesh.scale.set(
          1 + Math.sin(time * 6 + i) * 0.1,
          1 + Math.cos(time * 6 + i) * 0.15,
          1 + Math.sin(time * 6 + i) * 0.1
        );

        const toPlayer = player.position.clone().sub(e.mesh.position);
        toPlayer.y = 0;
        const dist = toPlayer.length();

        // Aggro if hero is near
        if (dist < 18 && dist > 1.1) {
          toPlayer.normalize();
          e.mesh.position.addScaledVector(toPlayer, e.speed * delta);
        }

        // Deal damage to player on touch
        e.attackCooldown -= delta;
        if (dist <= 1.2 && e.attackCooldown <= 0) {
          hero.hp = Math.max(0, hero.hp - 12);
          document.getElementById('hp-bar').style.width = `${(hero.hp / hero.maxHp) * 100}%`;
          document.getElementById('hp-text').innerText = `${hero.hp}/${hero.maxHp}`;
          e.attackCooldown = 1.0;

          if (hero.hp <= 0) {
            hero.hp = hero.maxHp;
            player.position.set(0, 0, 0); // Respawn hero
          }
        }

        // Slime death
        if (e.hp <= 0) {
          scene.remove(e.mesh);
          enemies.splice(i, 1);
          hero.kills++;
          hero.xp += 40;

          // Level progression
          if (hero.xp >= hero.xpNeeded) {
            hero.level++;
            hero.xp -= hero.xpNeeded;
            hero.xpNeeded = Math.floor(hero.xpNeeded * 1.5);
            hero.maxHp += 20;
            hero.hp = hero.maxHp;
            hero.attackPower += 10;
            document.getElementById('lvl-display').innerText = hero.level;
          }

          document.getElementById('kill-count').innerText = hero.kills;
          document.getElementById('hp-bar').style.width = `${(hero.hp / hero.maxHp) * 100}%`;
          document.getElementById('hp-text').innerText = `${hero.hp}/${hero.maxHp}`;
          document.getElementById('xp-bar').style.width = `${(hero.xp / hero.xpNeeded) * 100}%`;
          document.getElementById('xp-text').innerText = `${hero.xp}/${hero.xpNeeded}`;

          spawnEnemy(); // Maintain ambient monster count
        }
      }

      // Smooth Isometric Camera Follow
      const targetCamPos = new THREE.Vector3(
        player.position.x,
        player.position.y + 14,
        player.position.z + 14
      );
      camera.position.lerp(targetCamPos, 0.08);
      camera.lookAt(player.position.x, player.position.y + 1, player.position.z);

      renderer.render(scene, camera);
    }

    // --- 9. Window Resize Handler ---
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    update();
  </script>
</body>
</html>
