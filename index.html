<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Vector Dash</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0d0f18;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #ui {
      position: absolute;
      top: 24px;
      left: 24px;
      right: 24px;
      display: flex;
      justify-content: space-between;
      color: #fff;
      font-weight: 600;
      font-size: 1.1rem;
      letter-spacing: 0.05em;
      pointer-events: none;
      text-transform: uppercase;
    }

    .hud-label {
      color: #58607c;
      font-size: 0.8rem;
      display: block;
      margin-bottom: 2px;
    }

    #overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(13, 15, 24, 0.85);
      backdrop-filter: blur(8px);
      color: #ffffff;
      opacity: 1;
      transition: opacity 0.3s ease;
    }

    #overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    h1 {
      font-size: 3rem;
      font-weight: 800;
      letter-spacing: 0.1em;
      margin-bottom: 8px;
      text-transform: uppercase;
      background: linear-gradient(135deg, #00f2fe, #4facfe);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p {
      color: #8b9bb4;
      font-size: 1.1rem;
      margin-bottom: 32px;
    }

    .btn {
      padding: 14px 36px;
      font-size: 1rem;
      font-weight: 600;
      color: #0d0f18;
      background: #00f2fe;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(0, 242, 254, 0.4);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 30px rgba(0, 242, 254, 0.6);
    }
  </style>
</head>
<body>

  <div id="ui">
    <div>
      <span class="hud-label">Score</span>
      <span id="scoreVal">0</span>
    </div>
    <div style="text-align: right;">
      <span class="hud-label">Best</span>
      <span id="bestVal">0</span>
    </div>
  </div>

  <div id="overlay">
    <h1 id="titleText">Vector Dash</h1>
    <p id="subText">Press Space or Tap to Jump</p>
    <button class="btn" id="startBtn">Start Run</button>
  </div>

  <canvas id="gameCanvas"></canvas>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreVal = document.getElementById('scoreVal');
    const bestVal = document.getElementById('bestVal');
    const overlay = document.getElementById('overlay');
    const startBtn = document.getElementById('startBtn');
    const titleText = document.getElementById('titleText');
    const subText = document.getElementById('subText');

    let width, height;
    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // Game State
    let isRunning = false;
    let score = 0;
    let bestScore = parseInt(localStorage.getItem('vector_dash_best') || '0', 10);
    bestVal.textContent = bestScore;

    let baseSpeed = 8;
    let speed = baseSpeed;
    let gravity = 0.85;
    let floorY = 0;

    // Player
    const player = {
      x: 100,
      y: 0,
      size: 32,
      vy: 0,
      isGrounded: false,
      jumpForce: -16,
      jump() {
        if (this.isGrounded) {
          this.vy = this.jumpForce;
          this.isGrounded = false;
          createDust(this.x + this.size / 2, this.y + this.size);
        }
      },
      update() {
        this.vy += gravity;
        this.y += this.vy;

        if (this.y >= floorY - this.size) {
          this.y = floorY - this.size;
          this.vy = 0;
          this.isGrounded = true;
        }
      },
      draw() {
        ctx.fillStyle = '#00f2fe';
        ctx.shadowColor = '#00f2fe';
        ctx.shadowBlur = 15;
        ctx.fillRect(this.x, this.y, this.size, this.size);
        ctx.shadowBlur = 0;
      }
    };

    // Obstacles & Particles
    let obstacles = [];
    let particles = [];

    function createDust(x, y) {
      for (let i = 0; i < 6; i++) {
        particles.push({
          x,
          y,
          vx: (Math.random() - 0.5) * 4,
          vy: (Math.random() - 0.5) * 2,
          size: Math.random() * 3 + 2,
          alpha: 1,
          color: '#00f2fe'
        });
      }
    }

    function spawnObstacle() {
      const h = Math.random() * 40 + 30;
      const w = Math.random() * 20 + 20;
      obstacles.push({
        x: width + 50,
        y: floorY - h,
        w,
        h,
        color: '#ff2a6d'
      });
    }

    let spawnTimer = 0;
    let spawnInterval = 90;

    function resetGame() {
      score = 0;
      speed = baseSpeed;
      player.y = floorY - player.size;
      player.vy = 0;
      obstacles = [];
      particles = [];
      spawnTimer = 0;
      spawnInterval = 90;
      scoreVal.textContent = '0';
    }

    function gameOver() {
      isRunning = false;
      if (score > bestScore) {
        bestScore = Math.floor(score);
        localStorage.setItem('vector_dash_best', bestScore);
        bestVal.textContent = bestScore;
      }
      titleText.textContent = 'Run Ended';
      subText.textContent = `Score: ${Math.floor(score)}`;
      startBtn.textContent = 'Try Again';
      overlay.classList.remove('hidden');
    }

    function handleInput() {
      if (!isRunning) return;
      player.jump();
    }

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' || e.code === 'ArrowUp') {
        e.preventDefault();
        handleInput();
      }
    });

    window.addEventListener('pointerdown', (e) => {
      if (e.target.tagName !== 'BUTTON') {
        handleInput();
      }
    });

    startBtn.addEventListener('click', () => {
      resetGame();
      isRunning = true;
      overlay.classList.add('hidden');
    });

    // Main Game Loop
    function loop() {
      floorY = height * 0.75;

      ctx.clearRect(0, 0, width, height);

      // Draw Floor
      ctx.strokeStyle = '#252a40';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, floorY);
      ctx.lineTo(width, floorY);
      ctx.stroke();

      if (isRunning) {
        score += 0.1;
        speed += 0.001; // subtle acceleration
        scoreVal.textContent = Math.floor(score);

        // Handle Obstacle Spawning
        spawnTimer++;
        if (spawnTimer >= spawnInterval) {
          spawnObstacle();
          spawnTimer = 0;
          spawnInterval = Math.max(45, Math.floor(80 - speed * 2) + Math.random() * 20);
        }

        player.update();
      }

      player.draw();

      // Update & Draw Obstacles
      for (let i = obstacles.length - 1; i >= 0; i--) {
        const obs = obstacles[i];
        if (isRunning) obs.x -= speed;

        ctx.fillStyle = obs.color;
        ctx.shadowColor = obs.color;
        ctx.shadowBlur = 10;
        ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
        ctx.shadowBlur = 0;

        // Collision Check (AABB)
        if (
          player.x < obs.x + obs.w &&
          player.x + player.size > obs.x &&
          player.y < obs.y + obs.h &&
          player.y + player.size > obs.y
        ) {
          gameOver();
        }

        if (obs.x + obs.w < 0) {
          obstacles.splice(i, 1);
        }
      }

      // Update & Draw Particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.alpha -= 0.03;

        if (p.alpha <= 0) {
          particles.splice(i, 1);
          continue;
        }

        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.alpha;
        ctx.fillRect(p.x, p.y, p.size, p.size);
        ctx.globalAlpha = 1;
      }

      requestAnimationFrame(loop);
    }

    requestAnimationFrame(loop);
  </script>
</body>
</html>
